name: Record v3 model run

# Runs the v3 evaluation against the real model once, records every model response, and pushes the
# recording and the report to a branch for review. Needs the repository secret ANTHROPIC_API_KEY
# (Settings > Secrets and variables > Actions). The key is only read here; it never enters the repo.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to record
        default: claude-haiku-4-5-20251001
        required: true
      cache_artifact_run:
        description: Optional run ID of an earlier failed run whose saved recording should be reused
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: record-v3
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      HEARTH_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Reuse an earlier partial recording
        if: inputs.cache_artifact_run != ''
        uses: actions/download-artifact@v4
        with:
          name: v3-model-cache
          path: backend/evals/model_cache
          run-id: ${{ inputs.cache_artifact_run }}
          github-token: ${{ github.token }}

      - name: Check the API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Record and score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEARTH_MODEL_MODE: record
        run: |
          set -o pipefail
          python scripts/score_v3.py | tee score.txt

      # Keep whatever was recorded even if the run failed partway, so a re-run only pays for the rest.
      - name: Save the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-model-cache
          path: backend/evals/model_cache
          if-no-files-found: ignore

      - name: Replay reproduces the report
        run: |
          cp evals/v3_report.json /tmp/recorded.json
          python scripts/score_v3.py > /dev/null
          diff /tmp/recorded.json evals/v3_report.json

      - name: Release gate (reported, not enforced here)
        run: |
          { echo '### v3 recorded run'; echo; echo '```'; cat score.txt; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"
          if python -m pytest -q tests/test_v3.py -k release_gate; then
            echo "Release gate: **passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release gate: **failed** (see the report)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push the recording to a branch for review
        run: |
          branch="v3-run-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add evals/model_cache evals/v3_report.json
          git commit -m "Record v3 model run ($HEARTH_MODEL)"
          git push origin "$branch"
          echo "Pushed $branch. Open a pull request from it to review the results." >> "$GITHUB_STEP_SUMMARY"
