name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests and release gates
        run: python -m pytest -q
      - name: Recorded v3 run replays to the committed report
        run: |
          if [ ! -d evals/model_cache ]; then echo "No recorded v3 run yet; skipping."; exit 0; fi
          git ls-files --error-unmatch evals/v3_report.json
          export HEARTH_MODEL=$(python -c "import json; print(json.load(open('evals/v3_report.json'))['model']['model'])")
          python scripts/score_v3.py
          git diff --exit-code evals/v3_report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
